name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alpine-musl:
    name: Alpine / musl
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: apk add --no-cache build-base gcompat gdb git libarchive-tools mesa-vulkan-swrast python3

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        env:
          CC: gcc
          CXX: g++
        run: ./build -j12

      - name: Test
        env:
          CC: gcc
          CXX: g++
        run: ./build -j12 test

      - name: Vulkan
        env:
          CC: gcc
          CXX: g++
        run: ./build -j12 vulkan_test

  fedora-gcc:
    name: Fedora / GCC
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: dnf install -y bsdtar gcc gcc-c++ git glibc-static libstdc++-static mesa-vulkan-drivers python3

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bridge
        env:
          CC: gcc
          CXX: g++
        run: ./build -j12 pthread_test

      - name: Vulkan
        env:
          CC: gcc
          CXX: g++
        run: ./build -j12 vulkan_test

  ubuntu-arm:
    name: Ubuntu / arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang g++ gdb libarchive-tools mesa-vulkan-drivers python3

      - name: Bridge
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 pthread_test

      - name: Test
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 test

      - name: Corpus
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 corpus

      - name: Vulkan
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 vulkan_test

  ubuntu-clang:
    name: Ubuntu / Clang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang g++ gdb libarchive-tools mesa-vulkan-drivers python3

      - name: Bridge
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 pthread_test

      - name: Vulkan
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 vulkan_test

      - name: Corpus
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 corpus

      - name: ABI diff
        env:
          CC: clang
          CXX: clang++
        run: ./build -j12 abi_diff

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .build/tst/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: corpus-abi
          verbose: true

  nixos-lavapipe:
    name: NixOS / lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang g++ libarchive-tools python3

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The NixOS driver layout: the libraries stay in the store with their
      # RUNPATH closure, the ICD manifests appear under
      # /run/opengl-driver/share, and no FHS path carries any manifest.
      - name: Lay out the NixOS driver tree
        run: |
          store="$(nix build --no-link --print-out-paths nixpkgs#mesa | head -1)"
          test -n "$(find "$store/share/vulkan/icd.d" -name 'lvp_icd*.json' -print -quit)"
          sudo mkdir -p /run/opengl-driver
          sudo ln -s "$store/share" /run/opengl-driver/share
          sudo rm -rf /usr/share/vulkan /usr/local/share/vulkan /etc/vulkan

      - name: Vulkan
        env:
          CC: clang
          CXX: clang++
        run: |
          ./build -j12 vulkan
          env -u XDG_DATA_DIRS -u XDG_CONFIG_DIRS -u VK_DRIVER_FILES -u VK_ICD_FILENAMES ./vulkan nixos.png
          echo "9abbdcc0f3290f075f404ece8b4fd2966c46e97e5f8e5733221632891b9d1648  nixos.png" | sha256sum -c
